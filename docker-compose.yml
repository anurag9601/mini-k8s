services:
  postgres:
    container_name: postgres-db
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - "./postgres_data:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mydb
  valkey:
    container_name: valkey-cache
    image: valkey/valkey
    ports:
      - "6380:6380"
    volumes:
      - "./valkey_data:/data"

volumes:
  postgres_data:
  valkey_data: